# Fast gates only. The full suites (158 pytest + 601 vitest) belong in CI, not in a commit hook --
# a hook that takes a minute gets bypassed with `--no-verify`, and a bypassed hook protects nothing.
#
# Install once per clone:  uvx pre-commit install
# Run over everything:     uvx pre-commit run --all-files
#
# The formatting hooks below were added only AFTER the repo was formatted in one dedicated commit,
# recorded in .git-blame-ignore-revs so `git blame` skips it. That ordering matters: enabling them on an
# unformatted repo makes the next commit that touches any file a reformatting commit, burying the real
# change. What that commit actually moved, measured against the tracked tree rather than the working
# directory: ruff-format rewrote 76 files, trailing-whitespace 1 (three lines of .editorconfig), and
# end-of-file-fixer 1. All 158 Python tests and `ruff check` passed across it, and nothing semantic was
# at stake -- no multi-line string contained trailing whitespace, and no Markdown file relied on two
# trailing spaces as a hard line break.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        # Generated artifacts and the fixture pinning the Python scorer to its TypeScript port must
        # never be touched by a formatting hook -- a byte change there breaks the pin.
        exclude: ^api/src/data/|^api/test/fixtures/
      - id: end-of-file-fixer
        exclude: ^api/src/data/|^api/test/fixtures/
      - id: check-yaml
      - id: check-json
        # api/src/data/*.json are large generated artifacts. name-idf.json (416 KiB) is the IDF table
        # the name scorer bundles, and name-match-vectors.json is the fixture pinning the Python
        # scorer to its TypeScript port -- re-parsing them on every commit buys nothing.
        exclude: ^api/src/data/|^api/test/fixtures/
      - id: check-merge-conflict
      - id: check-added-large-files
        # name-idf.json is 416 KiB and intentionally committed.
        args: [--maxkb=600]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      # tsc is the only check that catches a type error across the whole Workers app, and it is fast
      # enough for a hook. Runs whole-project rather than per-file, because TypeScript's answer for
      # one file depends on the others.
      - id: workers-typecheck
        name: Workers typecheck (tsc --noEmit)
        entry: bash -c 'cd api && npm run --silent typecheck'
        language: system
        pass_filenames: false
        files: ^api/(src|test)/.*\.(ts|json)$
