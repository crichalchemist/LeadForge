[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadforge"
version = "0.1.0"
description = "Lead generation pipeline for hyper-local small businesses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.15.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "celery[redis]>=5.4.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.42.0",
    "azure-ai-inference>=1.0.0b9",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
leadforge = "leadforge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]
# The codebase's 99th-percentile line is 97 characters; 120 leaves headroom for SQLAlchemy column
# definitions without licensing runaway lines.
line-length = 120
# Alembic generates these. Linting generated code produces noise nobody acts on, and reformatting it
# makes the next autogenerate diff unreadable.
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.ruff.lint.per-file-ignores]
# One-off measurement and build scripts are tools, not shipped code, and holding them to production
# style would mean ~190 violations nobody is going to fix. Style is relaxed; the correctness rules
# (F*) still apply, because an unused import or a dead variable is a bug wherever it lives.
# This pattern matches direct children only, so scripts/lib/ stays FULLY linted -- name_match.py is
# load-bearing, the canonical Python scorer that name-match-vectors.json pins the TS port against.
"scripts/*.py" = ["E501", "E701", "E702", "E401", "E402", "E741", "N806"]
# The LLM modules embed JSON schemas as literal prompt text. Re-wrapping those lines would change
# what the model is actually sent, so this is a behaviour boundary rather than a style preference.
"src/leadforge/llm/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
