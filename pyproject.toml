[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leadforge"
version = "0.1.0"
description = "Lead generation pipeline for hyper-local small businesses"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "geoalchemy2>=0.15.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.7.0",
    "typer>=0.15.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
    "celery[redis]>=5.4.0",
    "python-dotenv>=1.0.0",
    "anthropic>=0.42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[project.scripts]
leadforge = "leadforge.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/leadforge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
